ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes -MultiViews
        DirectorySlash Off
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        LimitRequestBody 16384
        RewriteEngine On
        Include /etc/apache2/project-routes.conf
        # Never send API requests or missing assets to the React router.
        RewriteRule ^api(?:/|$) - [END]
        RewriteRule ^assets(?:/|$) - [END]
        # Serve prerendered route HTML without forcing a trailing slash.
        RewriteCond %{DOCUMENT_ROOT}/$1.html -f
        RewriteRule ^(.+?)/?$ $1.html [END]
        RewriteCond %{DOCUMENT_ROOT}/$1/index.html -f
        RewriteRule ^(.+?)/?$ $1/index.html [END]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [END]
    </Directory>
    ErrorDocument 404 /index.html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# Keep the prefork PHP runtime small at idle and bounded under load.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 3
    MaxRequestWorkers 10
    MaxConnectionsPerChild 1000
</IfModule>
